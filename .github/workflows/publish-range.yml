name: Publish Archive Range

# Build/publish release bundles for a range of archived days: GitHub release
# asset plus a single Arweave upload per day when the repo wallet is funded.
# Idempotent: existing assets and recorded Arweave transactions are skipped,
# so the workflow can resume after any interruption (e.g. topping up the
# Arweave wallet and finishing the historical uploads).

on:
  workflow_dispatch:
    inputs:
      start:
        description: "First archive date, YYYY-MM-DD."
        required: true
        type: string
      end:
        description: "Last archive date, YYYY-MM-DD."
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: rso-node-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      RSO_NODE_BRANCH: ${{ vars.RSO_NODE_BRANCH || 'node' }}
    steps:
      - name: Validate date inputs
        env:
          INPUT_START: ${{ inputs.start }}
          INPUT_END: ${{ inputs.end }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, sys
          for name in ("INPUT_START", "INPUT_END"):
              value = os.environ.get(name, "")
              if re.fullmatch(r"[0-9]{4}-[0-9]{2}-[0-9]{2}", value) is None:
                  print(f"Invalid {name}: {value!r}")
                  sys.exit(1)
          PY
          {
            echo "RSO_PUBLISH_START=${INPUT_START}"
            echo "RSO_PUBLISH_END=${INPUT_END}"
          } >> "$GITHUB_ENV"

      - name: Check out node branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RSO_NODE_BRANCH }}
          fetch-depth: 0

      - name: Hydrate catalogs for the range
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 pipeline/snapshot.py hydrate-catalogs \
            --start "$RSO_PUBLISH_START" --end "$RSO_PUBLISH_END"

      - name: Backfill card-parity aggregates for the range
        # Add on_orbit/reentered/band/type/delta to each day's manifest + ledger
        # from the just-hydrated catalogs. No --force: already-published days take
        # the annotation-preserving top-up path, so bundle bytes stay identical.
        run: |
          set -euo pipefail
          python3 pipeline/snapshot.py rebuild-content \
            --start "$RSO_PUBLISH_START" --end "$RSO_PUBLISH_END"

      - name: Publish bundles (GitHub asset + single Arweave upload per day)
        env:
          GH_TOKEN: ${{ github.token }}
          ARWEAVE_JWK: ${{ secrets.ARWEAVE_JWK }}
        run: |
          set -euo pipefail
          python3 pipeline/snapshot.py publish \
            --start "$RSO_PUBLISH_START" --end "$RSO_PUBLISH_END"

      - name: Build Tier-1 index
        # GitHub-raw mirror (node branch). Arweave permanence is opt-in to avoid
        # re-paying AR per run: `build-index --arweave` with ARWEAVE_JWK set.
        run: python3 pipeline/snapshot.py build-index --repo "$GITHUB_REPOSITORY" --branch "$RSO_NODE_BRANCH"

      - name: Commit storage receipts
        run: bash scripts/git-commit-paths.sh "$RSO_NODE_BRANCH" "Record archive publish destinations" data ledger.json latest.json index
